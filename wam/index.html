<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://cf.channel.io"
    />
    <link
      rel="stylesheet"
      href="https://cf.channel.io/asset/font/Inter/inter.css"
    />
    <title>망한 선배 박람회</title>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
    <script>
      // 호스트가 ChannelIOWam을 아직 심지 않았을 수 있다(로컬 dev, 주입 지연).
      // 여기서 예외가 나면 배경색이 끝까지 비어 화면이 깨져 보이므로 한 겹 감싼다.
      try {
        var wam = window.ChannelIOWam
        var appearance = wam ? wam.getWamData('appearance') : null
        var dark = appearance
          ? appearance === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.body.style.backgroundColor = dark ? '#1D1A18' : '#D7D1CB'
      } catch (error) {
        document.body.style.backgroundColor = '#D7D1CB'
      }
    </script>
  </body>
</html>
